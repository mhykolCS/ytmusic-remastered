name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run setup
      - run: npm run build -- --clean-preferences
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: YTMusic-Remastered-Chrome
          path: dist/
